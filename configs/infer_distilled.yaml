# Distilled causal inference hyperparameters only.
# Input data, model directories, checkpoint, and output are CLI arguments.

profile: standard
height: 704
width: 1280
num_blocks: 1
seed: 3407
schedule: [1000, 667, 333]

latent_window_size: 21
vae_context_blocks: 2
chunk_size: 3
context_chunks: 7
context_selection: per_3latentframe

memory_mode: c0_plus_generated
memory_publish_interval: 1
dynamic_context: true
# Among the pose-nearest candidates, prefer the oldest context observation.
dynamic_context_selection: oldest     # oldest | latest
# Opt-in: exclude memory/context still visible in the rolling KV prefix.
nonlocal_memory_context: false
context_pose_pool_size: 5
student_cfg_scale: 3.0
negative_prompt: 色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走

trans_scale: logd4
mosaic_selection_mode: projection_iou
mosaic_candidate_nms_mode: coverage
mosaic_candidate_projection_iou_threshold: 0.7
mosaic_candidate_pose_distance_threshold: 0.25
mosaic_candidate_pool_multiplier: 2.5
mosaic_coverage_pool_stride: 2
mosaic_query_reference_frame: 4
mosaic_intrinsics_mode: per_frame
mosaic_fuse_mode: fill_stop_zbuffer
mosaic_drop_holes: false

da3_process_res: 448
da3_autocast_dtype: bfloat16
